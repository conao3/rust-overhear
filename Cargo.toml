[workspace]
resolver = "2"
members = ["crates/overhear-core", "crates/overhear-server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/conao3/rust-overhear"

[workspace.dependencies]
overhear-core = { path = "crates/overhear-core", default-features = false }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-graphql = "7"
async-graphql-axum = "7"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
